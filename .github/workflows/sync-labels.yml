name: sync-labels

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop

    paths:
      - ".github/labels.yml"

permissions:
  issues: write

jobs:
  sync:

    name: Synchronize labels

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Synchronize labels

        uses: micnncim/action-label-syncer@v1

        with:
          manifest: .github/labels.yml
          prune: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}